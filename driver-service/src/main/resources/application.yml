server:
  port: 8082

spring:
  application:
    name: driver-service
  datasource:
    url: jdbc:postgresql://localhost:5432/urbanride_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    status-page-url: http://localhost:${server.port}/swagger-ui/index.html
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
