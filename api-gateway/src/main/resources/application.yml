server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:5175"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - "Authorization"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: swagger-ui-redirect
          uri: noop://default
          predicates:
            - Path=/swagger-ui/index.html
          filters:
            - RedirectTo=302, /webjars/swagger-ui/index.html
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: driver-service
          uri: lb://DRIVER-SERVICE
          predicates:
            - Path=/api/drivers/**
        - id: ride-service
          uri: lb://RIDE-SERVICE
          predicates:
            - Path=/api/rides/**
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
        - id: auth-docs
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/v3/api-docs/auth/**
          filters:
            - RewritePath=/v3/api-docs/auth(?<segment>/?.*), /v3/api-docs$\{segment}
        - id: driver-docs
          uri: lb://DRIVER-SERVICE
          predicates:
            - Path=/v3/api-docs/driver/**
          filters:
            - RewritePath=/v3/api-docs/driver(?<segment>/?.*), /v3/api-docs$\{segment}
        - id: ride-docs
          uri: lb://RIDE-SERVICE
          predicates:
            - Path=/v3/api-docs/ride/**
          filters:
            - RewritePath=/v3/api-docs/ride(?<segment>/?.*), /v3/api-docs$\{segment}
        - id: payment-docs
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/v3/api-docs/payment/**
          filters:
            - RewritePath=/v3/api-docs/payment(?<segment>/?.*), /v3/api-docs$\{segment}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth
      - name: Driver Service
        url: /v3/api-docs/driver
      - name: Ride Service
        url: /v3/api-docs/ride
      - name: Payment Service
        url: /v3/api-docs/payment
    urls-primary-name: Auth Service

jwt:
  secret: ${JWT_SECRET:urbanglide_secret_key_which_should_be_long_enough_for_hs256_algorithm!}

eureka:
  instance:
    prefer-ip-address: true
    status-page-url: http://localhost:${server.port}/webjars/swagger-ui/index.html
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health
